# Runs the Python server's test suite. The native app has its own workflow in
# app.yml; before this file existed a server-only change ran no checks at all.
name: server

on:
  push:
    paths:
      - "server/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - "tests/**"
      - "requirements*.txt"
      - "pytest.ini"
      - ".github/workflows/server.yml"

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # The suite's only third-party imports are fastapi, numpy and pytest.
      # requirements.txt also pins torch, silero-vad and onnxruntime for the
      # live VAD path, but server/vad.py imports them lazily inside functions
      # the tests never reach -- confirmed by running the suite with those
      # packages blocked. Installing the lean set keeps this job off a ~2 GB
      # download; requirements.txt is still the install for running the server.
      # requirements.txt is passed as a constraints file so the versions here
      # match the ones it pins.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c requirements.txt fastapi numpy -r requirements-dev.txt

      - name: Test
        run: python -m pytest -q
